name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build installers
        run: npx tauri build --bundles nsis,msi

      - name: Rename installers
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)[0] "out/MovieArena-$version-setup.exe"
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)[0] "out/MovieArena-$version.msi"
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: movie-arena-windows
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Movie Arena ${{ github.ref_name }}
          files: out/*
          body: |
            Movie Arena for Windows 10 and 11.

            Download `MovieArena-*-setup.exe` and run it. It installs for your user account, no admin rights needed, and sets up WebView2 if the PC doesn't have it.

            The `.msi` is the same app for managed installs.

            The installer is not code-signed yet, so Windows SmartScreen may warn on first run. Choose "More info", then "Run anyway".
