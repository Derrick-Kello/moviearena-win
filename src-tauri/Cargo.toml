[package]
name = "movie-arena"
version = "1.0.0"
description = "Movie Arena: a streaming portal launcher with a built-in ad shield"
edition = "2021"

[lib]
name = "movie_arena_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
